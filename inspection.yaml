# ══════════════════════════════════════════════════════════════════════════════
# sandbar 项目的巡检声明（t260916-02 声明落位迁移A：每项目仓内单文件）
#
# 【落位】本文件=sandbar 项目（注册表 key=sandbar，主目录=本仓根）的巡检声明，从
#   server/engine/inspection.yaml 迁来（引擎侧只留机制：解析=inspection_decl.py，
#   开票=inspection_ticketing.py，运维通道=inspection_trigger.py）。
#   解析链：项目注册条目 paths.inspection_decl 未声明 → 默认落位 <dirs[0]>/inspection.yaml
#   =本文件；要指到别处（如机器级 ~/.sandbar/projects/sandbar/inspection.yaml），在
#   ~/.sandbar/projects/sandbar/project.yaml 加 paths.inspection_decl 声明（样例见
#   docs/inspection-sample.yaml 头注）。聚合（板面白名单/漏跑核查/schedule-up）遍历注册
#   项目读各自声明——本文件只管 sandbar 自己的实例。
#
# 【票号】巡检票号=工单号同形式 t<YYMMDD>-<NN>（t260916-02 起，走既有票号分配）；
#   「每期一票」按（实例,期号）显式去重（SA InspectionInstance/InspectionPeriod）。
#
# 【改声明即改行为】引擎只出通用调度器与开票机制（inspection_trigger.py /
#   InspectionPeriodicWorkflow），「怎么定时、跑哪个 workflow」全部由本文件声明：
#   改声明即改行为，不改引擎码。解析真源=inspection_decl.py，只认其头注声明的 YAML
#   子集；子集外形态一律 fail-closed 报错点名（不静默降级、不猜）。
#
# 【字段说明】（与迁出前逐项一致，t260916-02 未动字段词法）
#   schema    声明格式版本（现只认 v1）
#   instances 巡检实例表（每实例=一个扫描面的调度位；每期一票按实例独立开票）
#   id        实例标识（小写 slug；期号检索面=SA，票号不再由实例 id 组成）
#   project_key 实例级项目身份（t260915-20 起，所有实例必填——enabled 与否都不豁免）：
#             本实例巡检票归属哪个项目（=项目注册表 key）。起票时盖章 ProjectKey 搜索
#             属性，repo_root 缺省也按它解析注册条目主目录（dirs[0]）。与
#             schedule.project_key（计数取数面）是两个字段：实例级=归属、schedule 级=计数，
#             绝不互串。改归属后重跑 schedule-up 即生效（update 分支重铸 action）。
#   enabled   是否启用（false=占位不调度不触发——声明驱动开关，行为级验收点）
#   schedule  定时法声明：kind=cron（五字段 cron）| every-n-tickets（每并 N 张票触发）|
#             race-first（cron 与计数先到者）。计数 kind 必带：n（阈值 1–10000）、
#             source（计数源，现只接 archive-dir=ticket 归档目录）、project_key（归档
#             目录的项目 key，票计数=该 key data/tickets 一级条目数）
#   scan_face 本实例跑的扫描器（test|doc|mechanism|simplify|stage；缺省 test）
#   suite     套件档（空=不跑套件；full=本期在巡检自有泳道跑集成全集，结果进票面与
#             发现清单。只有全集一档；词法外 fail-closed 点名）。套件开关在运行期由
#             workflow 读本声明判定（resolve_inspection_plan 活动），不进调度 payload：
#             改本字段即改行为，不必重跑 schedule-up。
#   tz        调度时区（IANA 名如 Asia/Shanghai）：Temporal Schedule 的 cron 默认按 UTC
#             求值——不写 tz，「每天 07:30」会落在本地 15:30。人读钟点必须与本字段同口径
#             声明；空=Temporal 缺省（UTC）。
#   workflow  本实例跑的 workflow 类型名（引擎侧已接线巡检 workflow 白名单校验）
#   template  巡检票模板标识（票面展示用）
# ══════════════════════════════════════════════════════════════════════════════
schema: v1
instances:
  - id: integration-tests
    enabled: true
    project_key: sandbar
    # t261004-42: this instance carries the tier-admission inspection (the
    # end-to-end admission rule, docs/reference/test-tiers-and-e2e-admission.md).
    # Its criteria text lives with the other declared per-face criteria —
    # server/engine/inspection_inspect.py PROFILE_TEXTS['test'], items A/B/C —
    # so a reader sees one list, not two. No scheduling face changed here.
    # 260913-02 宿主令「每日调度接真」：每周一 09:00 → 每天 07:30（结果当天上班即读，
    # 与 docs-sync 的周一 10:00 不撞）。改本行即改 cadence，再跑
    #   inspection_trigger.py schedule-up --instance integration-tests --note <谁/为何/频率>
    # 让 Temporal Schedule 生效（机制在引擎、调度在声明）。
    suite: full
    tz: Asia/Shanghai
    schedule:
      kind: cron
      cron: 30 7 * * *
    workflow: InspectionPeriodicWorkflow
    template: inspection-lite
    # lane/watchdog 面阈值档（260926，KI-122 追加面 / KI-126 同源）：本期**只读**扫
    # **非终态票**的工作流时间线/快照，出三类发现——①同票重跑轮次 > rerun_rounds；
    # ②停在 tests-fault 回路超 fault_loop_min（判决已下却不收敛）；③在飞静默超
    # inflight_silent_min（僵尸票）。三键均为正整数（轮次 / 分钟）。
    # 第四判据（260926 同批，宿主级）——**测试夹具临时目录水位**：只读扫临时根顶层白名单
    # 前缀（测试夹具）的真目录，目录数 > tmp_fixture_max_dirs 或最老目录年龄 >
    # tmp_fixture_max_age_h（小时）→ 出 `tmp-fixture-water` 发现（宿主两次追问「巡检为什么
    # 没发现」后补的面：前三族看的是「票卡在泳道里」，看不见磁盘在漏）。两键亦为正整数。
    # 本行值 = 模块缺省（显式声明与缺省等价；改本行即改阈值）。键缺失/畸形 → 回落缺省，
    # 且票面 lane 段点名「阈值来源=declaration|env|default」+ 逐键回落原因（不静默）；
    # 运维临时覆盖用环境变量 SANDBAR_TMP_FIXTURE_MAX_DIRS / SANDBAR_TMP_FIXTURE_MAX_AGE_H
    # （只补声明没写的键，被点名在 threshold_note 里）。
    # 取值理由：rerun_rounds=3 抓得住「同一票 5 轮 × ~2h 全量」的活锁（t260926-05 实案）；
    # tmp_fixture_max_dirs=1000 抓得住 260926 的 27.7 万（四个数量级）又不与日常churn 齐平，
    # tmp_fixture_max_age_h=6 与清扫器/`.mjs` 复收器同口径（无活套件会用到的龄线）。
    watchdog:
      rerun_rounds: 3
      fault_loop_min: 90
      inflight_silent_min: 120
      tmp_fixture_max_dirs: 1000
      tmp_fixture_max_age_h: 6
  # 261004 宿主令（「doc 每天跑也行的」）：周一批次 → **每天 10:00**（与 07:30 全量集成、
  # 09:30 simplify 错开）；文档库体量小（docs 25 篇 + notes 60 篇 ≈ 40 万 token），
  # 文档面按「每期全量读」设计，不是代码面的切片轮读——所以它天天跑得起。
  # 空转开关**不摘给本实例**：test_260929_inspection_no_change_skip.py 有一条契约
  # 「生产声明里只有 simplify-face 开 skip_when_unchanged（别的实例必须真跑）」——
  # 那是 260929 明确定下的口径，不随本次改频随手扩。要不要给文档面破例（整仓没动就
  # 不重读）已记入 notes/discussions/261004-文档面巡检-设计稿.md 的未决项，等宿主拍。
  # 261004 同批修：这条 schedule 的 action 身份字段此前全空（instance/face/project_key/
  # repo_root 都是 ""）→ 从来没产出过一期（台账只有 20260915）；本次 schedule-up 一并重铸。
  - id: docs-sync
    enabled: true
    project_key: sandbar
    scan_face: doc
    tz: Asia/Shanghai
    schedule:
      kind: cron
      cron: 0 10 * * *
    workflow: InspectionPeriodicWorkflow
    template: inspection-lite
  # ---- 票②（t260910-09）新面：能力已交付（inspection_scan_ms.py + face 分派），
  # ---- enabled=false 占位——启用按宿主节奏。启用路径：本文件改 true（或
  # ---- inspection_trigger.py schedule-up），启用即按 cron 每周自动开票。
  - id: mechanism-face
    enabled: false
    project_key: sandbar
    schedule:
      kind: cron
      cron: 0 7 * * 1
    workflow: InspectionPeriodicWorkflow
    template: inspection-lite
  # 260915 宿主令先试跑（手动 trigger 验产出质量，过了再 schedule-up 开每周定时）。
  # 注意：scan_face 缺省会落 test 面（票①行为）——本实例必须显式指 simplify。
  # 260929 宿主令（接线当场追改）：改**每天一次**（09:30 Asia/Shanghai），并加
  # skip_when_unchanged=true —— 「没有新 change 就不干啥」：起票前比对上次运行基点
  # sha 与当前 main HEAD，相同则本期只落一行裁决记录（决策=skipped-no-change），
  # 不铸票、不跑套件、不占期槽资源；漏跑核查读该记录，不把它算成漏跑。
  # tz 必填（此前缺省落 UTC：人读 08:00 实际是北京 16:00 —— 对账面 tz_missing 会点名）。
  - id: simplify-face
    enabled: true
    project_key: sandbar
    scan_face: simplify
    skip_when_unchanged: true
    tz: Asia/Shanghai
    schedule:
      kind: cron
      cron: 30 9 * * *
    workflow: InspectionPeriodicWorkflow
    template: inspection-lite
  # ---- t260915-18：stage 面（台面容量可见性）。扫描器=stage_docker inventory
  # ---- 只读清点（孤儿容器/容量逼近与撞闸/域外在册逐条开票；巡检绝不拆台——
  # ---- 回收动作只属 stage_docker sweep 与引擎所有者路径）。enabled=false 占位：
  # ---- 启用按宿主节奏，先手动 trigger 验产出质量，过了再 schedule-up。
  - id: stage-capacity
    enabled: false
    # t260915-20 合并消解：18 带进的实例按本票口径补实例级项目身份（占位不豁免——
    # 无身份的占位实例=无主票预定席）；stage 面扫的是引擎测试台（stage_docker
    # inventory 只读清点），归属 sandbar 与其余实例同口径。
    project_key: sandbar
    scan_face: stage
    tz: Asia/Shanghai
    schedule:
      kind: cron
      cron: 30 8 * * 1
    workflow: InspectionPeriodicWorkflow
    template: inspection-lite
# ---- 计数 kind 声明示例（t260911-02 已接线；启用前把 project_key 指向真项目 key，
# ---- 再 inspection_trigger.py schedule-up --instance <id> --note <谁/为何/频率>
