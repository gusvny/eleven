# sandbar 泳道复验声明（schema v1，字段级定义见 docs/design/sandbar项目接入契约v1.md ②a）。
# 字段级契约面：docs/design/sandbar项目接入契约v1.md ②a~②e（verify 声明道全段——
# lanes/checks/写集判定/回执语义；头注指向锁定，场景 contract-v11-regression-rods 守卫）。
# v2 契约：checks 是 lanes.code 下的列表命令制 [{id,cmd,cwd?,timeout?}]，不是顶层键。
# t260903-11 arbitrate 修正：seed/验收段版本把 checks 写在顶层，引擎按「未知顶层键」
# 整道 fail-closed（integ 道因此从未跑起来）——本版只动结构，两条 check 命令维持
# 验收段 13:17 原文不改动。
schema: v1
lanes:
  code:
    # 写集白名单（粗判据；工单 write_set 在场时优先于本表）：按本仓受控面实指。
    # 引擎 _in_write_set 是「精确路径或目录前缀（补 /）」语义，原「.」匹配不到任何
    # diff 路径（git 输出不带 ./ 前缀），等于全拒——按实指枚举修正。
    write_allow:
      - server/
      - integration/
      - docs/
      # notes/ 已除名（宿主令 260904 机械闸）：票据/知识库账本归 main 侧直管，
      # 工单不写——建单侧 ticket.py 与合并闸 verify_lane 双点独立拦截。
      - VERSION
      - sandbar
      - verify.yaml
      - README.md
      - CLAUDE.md
    checks:
      - id: py-compile
        cmd: PYTHONPYCACHEPREFIX=out/pycache python3 -m py_compile sandbar server/version.py server/installer/*.py server/installer/tests/*.py server/probes/*.py server/probes/tests/*.py server/tools/*.py
      - id: guard-3099-redline
        cmd: sh -c '! { grep -rn "pkill\|kill -9" bin/ server/ --include="*.sh" --include="*.py" 2>/dev/null; grep -n "pkill\|kill -9" sandbar 2>/dev/null; } | grep -v "^Binary" | grep 3099'
      # t260904-12 乙段：test 道（t260902-10 场景消费面）——venv 回落链，pytest 缺即红（fail-closed）。
      - id: test
        cmd: PY=server/dsh/temporal-poc/.venv/bin/python; [ -x "$PY" ] || PY=python3; PYTHONPYCACHEPREFIX=out/pycache "$PY" -m pytest server/dsh/temporal-poc/tests -q
integration:
  cmd: python3 integration/run_scenarios.py
  # t260904-12 乙段 supply 声明【暂撤——F-C 部署次序纪律】：supply 引擎支持已随本票
  # verify_lane.py 落地（工作树/合并后主仓均认 {cmd,supply}），但宿主机械消费链在合并前
  # 用主仓旧引擎副本（白名单只认 cmd）——声明先行会整道 fail-closed ran=0。故声明后行：
  # 本票合并入主仓后，由宿主令直落以下两条（逐字备好，届时直接粘回）：
  #   supply:
  #     - need: playwright-core（泳道 ui-check node_modules 软链主树，KI-036）
  #       cmd: 'MAIN="$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd)"; SRC="$MAIN/server/dsh/ui-check/node_modules/playwright-core"; [ -d "$SRC" ] || { echo "ENV_FAIL: 主树 playwright-core 缺失：$SRC"; exit 1; }; mkdir -p server/dsh/ui-check/node_modules; DST=server/dsh/ui-check/node_modules/playwright-core; [ -e "$DST" ] || ln -s "$SRC" "$DST"; [ -e "$DST/package.json" ] || { echo "ENV_FAIL: 软链后不可解析：$DST"; exit 1; }'
  #     - need: temporal CLI（泳道 bin 软链主树 bin/temporal，t260904-14 真票腿）
  #       cmd: 'MAIN="$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd)"; SRC="$MAIN/server/dsh/temporal-poc/bin/temporal"; [ -x "$SRC" ] || { echo "ENV_FAIL: 主树 temporal CLI 缺失：$SRC"; exit 1; }; mkdir -p server/dsh/temporal-poc/bin; [ -e server/dsh/temporal-poc/bin/temporal ] || ln -s "$SRC" server/dsh/temporal-poc/bin/temporal; server/dsh/temporal-poc/bin/temporal --version >/dev/null'
