schema: v1
lanes:
  code:
    write_allow:
      - .
checks:
  - id: py-compile
    cmd: python3 -m py_compile server/tools/verify_lane.py server/tools/ticket.py server/tools/workflow.py
  - id: guard-3099-redline
    cmd: sh -c '! grep -rn "pkill\\|kill -9" bin/ server/ --include="*.sh" --include="*.py" 2>/dev/null | grep -v "^Binary" | grep 3099'
integration:
  cmd: python3 integration/run_scenarios.py
