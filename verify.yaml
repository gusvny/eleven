# sandbar 泳道复验声明（schema v1，字段级定义见 docs/design/sandbar-project-onboarding-contract-v1.md ②a）。
# 字段级契约面：docs/design/sandbar-project-onboarding-contract-v1.md ②a~②e（verify 声明道全段——
# lanes/checks/写集判定/回执语义；头注指向锁定，场景 contract-v11-regression-rods 守卫）。
# v2 契约：checks 是 lanes.code 下的列表命令制 [{id,cmd,cwd?,timeout?}]，不是顶层键。
# t260903-11 arbitrate 修正：seed/验收段版本把 checks 写在顶层，引擎按「未知顶层键」
# 整道 fail-closed（integ 道因此从未跑起来）——本版只动结构，两条 check 命令维持
# 验收段 13:17 原文不改动。
schema: v1
lanes:
  code:
    # 写集白名单（粗判据；工单 write_set 在场时优先于本表）：按本仓受控面实指。
    # 引擎 _in_write_set 是「精确路径或目录前缀（补 /）」语义，原「.」匹配不到任何
    # diff 路径（git 输出不带 ./ 前缀），等于全拒——按实指枚举修正。
    write_allow:
      - server/
      - integration/
      - docs/
      # notes/ 已除名（宿主令 260904 机械闸）：票据/知识库账本归 main 侧直管，
      # 工单不写——建单侧 ticket.py 与合并闸 verify_lane 双点独立拦截。
      - VERSION
      - sandbar
      - verify.yaml
      - README.md
      - CLAUDE.md
    checks:
      - id: py-compile
        cmd: PYTHONPYCACHEPREFIX=out/pycache python3 -m py_compile sandbar server/version.py server/installer/*.py server/installer/tests/*.py server/probes/*.py server/probes/tests/*.py server/tools/*.py
      - id: guard-3099-redline
        cmd: sh -c '! { grep -rn "pkill\|kill -9" bin/ server/ --include="*.sh" --include="*.py" 2>/dev/null; grep -n "pkill\|kill -9" sandbar 2>/dev/null; } | grep -v "^Binary" | grep 3099'
      # t260904-12 乙段：test 道（t260902-10 场景消费面）——venv 回落链，pytest 缺即红（fail-closed）。
      # 261014: this check runs the whole engine suite (4510 items). verify_lane's
      # default per-check budget of 600s is BELOW what this machine measures for
      # that suite (~583s in the lane, more under load), so the merge gate went
      # red as a TIMEOUT rather than as a failing case - a green tree could be
      # judged red and the gate lost its judgement. An explicit 1000s budget
      # leaves a green tree ~1.7x headroom; the 20min activity cap
      # (MERGE_CHECK_TO) stays the outer bound, so a genuine hang is still
      # named and reclaimed inside a budget.
      - id: test
        timeout: 1000
        cmd: PY=server/engine/.venv/bin/python; [ -x "$PY" ] || PY=server/dsh/temporal-poc/.venv/bin/python; [ -x "$PY" ] || PY=python3; PYTHONPYCACHEPREFIX=out/pycache "$PY" -m pytest server/engine/tests -q  # engine-venv-compat（t260907-10：新路径优先、旧路径一轮回落，摘除票删旧腿）
      # 261004 宿主令（执行器请求 -0001 实测：merge_check 4/4 全绿而手工 lint 152 error）：
      # L1–L18 整条静态电池接进 code 道。此前它**不在任何合并闸里**，全靠执行器签字前手工跑——
      # 「靠人不靠机器」的单一防线。接线后每轮 merge_check 多跑一次 lint（秒级）。
      - id: lint
        cmd: python3 integration/lint_tests.py
integration:
  cmd: python3 integration/run_scenarios.py
  # 261027 宿主令：未来不允许再使用 docker。集成闸的 docker 供给要求已整条摘除
  # （见 supply 段注）；本仓测试不应再依赖 daemon/镜像/共享供给台。
  supply:
    # 261027 宿主令：未来不允许再使用 docker。原「docker 测试台在位」条整条摘除——
    # 集成闸不再要求 daemon/镜像/共享供给台；依赖 docker 的用例已在已知红册
    # （integration/known-red-baseline.json，home=「docker 面退出」）排除出常规轮次，
    # 批次台预起在 daemon 缺席时按具名跳过（integration/run_scenarios.py）。
    # 保留 playwright-core 条（浏览器族仍在消费，KI-036）。
    - need: playwright-core（泳道 ui-check node_modules 软链主树，KI-036）
      cmd: 'MAIN="$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd)"; SRC="$MAIN/server/ui-check/node_modules/playwright-core"; [ -d "$SRC" ] || SRC="$MAIN/server/dsh/ui-check/node_modules/playwright-core"; [ -d "$SRC" ] || { echo "ENV_FAIL: 主树 playwright-core 缺失：$SRC"; exit 2; }; mkdir -p server/ui-check/node_modules; DST=server/ui-check/node_modules/playwright-core; [ -e "$DST" ] || ln -s "$SRC" "$DST"; [ -e "$DST/package.json" ] || { echo "ENV_FAIL: 软链后不可解析：$DST"; exit 2; }'  # engine-venv-compat（t260907-10 主树迁移窗口回落；摘除票删旧腿）
  # ---- 每票集测段跳过慢池（t260913-03 落地；本声明由 main 侧随该票合并落账）----
  # 宿主 260913 令：把「耗时长、又不经常动」的基础类测试先拿出每票段，交给每天一次的
  # 集成测试巡检跑（巡检票 t260913-02）。判据纯机械＝**按执行器注册表自声明的池名过滤**，
  # 不做任何「基础设施/产品」的人工分类。
  # 实测依据（260913）：整套 237 条墙钟 20-28 分钟，其中 engine（约 1100s）+ exclusive
  # （约 590s）＝整轮墙钟（1693s，误差 0）；跳过两池后每票段 ran=194、墙钟 169s
  # （改前段级全跑 1498.9s）——即每票段从 25 分钟级降到 3 分钟级。
  # 生效边界（三态语义，环环可机械验证）：
  #   ① 仅每票集测段显式置 apply 时消费本声明（run_integration_tests → dev_lane 唯一
  #      true 站点）；巡检/手动/老载荷回放缺省=false → **恒全跑**（不含跳过面）——
  #      被跳池只由这一路覆盖，故该路的完整轮必须保持有效；
  #   ② 跳过必须点名：执行器汇总与起始各打一次「本轮跳过池=…（少 N 条）」，且
  #      ran==expected==本轮在册（被跳条目不在本轮在册，不冒充已跑、不假绿）；
  #   ③ 例外腿**已撤除**（宿主管 260914，起因＝KI-089）：旧口径为「票面写集命中
  #      exclude_pools_force_assets、或命中执行器 --print-pool-assets 派生的被跳池资产面
  #      → 强制全跑」；实测该腿对**全部**在跑票恒命中（写集带目录形条目如 integration/
  #      即命中整个测试目录，四票逐票命中 77~78 项），排除声明一次都没生效。现行：apply=true
  #      时**声明即跳过**；旧命中面仍进回执 pool_exclude.former_force_assets 留痕（少跑必须
  #      可见），但不再据此放行。下方 exclude_pools_force_assets 保留为历史声明/迁移期参照，
  #      **不再被消费**。
  # 资产面取值理由（260913 实核）：被跳池的场景只依赖「测试台定义 + 测试基建」，不直接
  # 依赖引擎源码（grep 无 agent_activities/verify_lane 引用）；compose 文件经实测**不在**
  # 注册表派生面内。派生面仍被 --print-pool-assets 用于未知池/非法池名单点判红。
  exclude_pools: engine,exclusive
  exclude_pools_force_assets:
    - server/docker-compose.test.yml

ui_evidence:
  dirs:
    - server/plugins/workbench/src/client/
    - server/plugins/workbench/lib/
    - server/plugins/providers/src/client/
    - app/src/
    - app/index.html
  # supply 保留字段（契约②a v2.0 形状）：本版引擎不消费——声明不构成截图供给保障
  # （截图供给保障在 integration.supply 侧，见上）。
  supply: playwright-core
