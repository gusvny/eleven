<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console + Executor Panel — projects, ticket order, running limit (mock v4)</title>
<style>
:root{
  --bg:#fff;--panel:#f6f8fa;--panel2:#eaeef2;--line:#d0d7de;--line-soft:#e4e9ee;--fg:#1f2328;--fg-soft:#424a53;--muted:#57606a;--faint:#6e7781;
  --blue:#0969da;--red:#cf222e;--amber:#9a6700;--green:#1a7f37;--hover:#eef1f4;--accent-soft:#dbe9ff;--accent-line:#7aa7e8;--dot:#99a3ad;--warn-soft:#fff8c5;
  --gx:14px;--gy:12px;--cardgap:8px;--sectgap:20px;
}
html[data-theme="dark"]{
  --bg:#141a24;--panel:#1b2330;--panel2:#222c3c;--line:#2e394d;--line-soft:#232c3a;--fg:#dbe4f0;--fg-soft:#c3cfdf;--muted:#8ea0b8;--faint:#5b6880;
  --blue:#4da3ff;--red:#ff6b6b;--amber:#ffb454;--green:#7ad48a;--hover:#1f2937;--accent-soft:#1d3550;--accent-line:#2f5b8a;--dot:#46536a;--warn-soft:#2a2313;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}
.shell{display:grid;grid-template-columns:400px minmax(0,1fr) 320px;height:100vh}
/* ---- left: projects, each with its ticket list (order = queue order) ---- */
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.sideHead{display:flex;align-items:center;gap:8px;padding:10px var(--gx);border-bottom:1px solid var(--line)}
.sideHead .t{font-weight:600;font-size:12px}
.sideHead .n{margin-left:auto;color:var(--muted);font-size:11px}
.sideBody{overflow-y:auto}
.proj{border-bottom:1px solid var(--line-soft)}
.prow{display:flex;align-items:center;gap:8px;padding:9px var(--gx);cursor:pointer}
.prow:hover{background:var(--hover)}
.proj[data-open="true"]>.prow{background:var(--panel2)}
.pname{font-weight:600;font-size:12px}
.views{display:flex;gap:1px;margin-left:2px}
.vi{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--faint);font-size:11px;cursor:pointer;opacity:.7}
.vi:hover{background:var(--hover);opacity:1}
.vi.on{background:var(--accent-soft);color:var(--blue);opacity:1}
.pmeta{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.chev{color:var(--muted);font-size:10px;transition:transform .15s}
.proj[data-open="true"] .chev{transform:rotate(90deg)}
.plist{display:none;padding:2px 8px 10px}
.proj[data-open="true"] .plist{display:block}
.tk{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.tk:hover{background:var(--hover)}
.tk.sel{background:var(--panel2);border-color:var(--line)}
.tk[data-drag="true"]{opacity:.5}
.tk[data-over="true"]{border-color:var(--accent-line);background:var(--accent-soft)}
.grip{flex:0 0 auto;color:var(--faint);font-size:11px;letter-spacing:-1px;cursor:grab;user-select:none}
.tk.fixed .grip{color:transparent;cursor:default}
.pos{flex:0 0 auto;margin-top:1px;min-width:18px;height:17px;border-radius:5px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.mark{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-top:5px}
.mark.run{background:var(--green)}
.mark.hold{background:var(--amber)}
.mark.paused{background:transparent;border:1.5px solid var(--faint)}
.tk .body{flex:1;min-width:0}
.tk .l1{display:flex;align-items:baseline;gap:6px}
.tk .id{flex:0 0 auto;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.tk .ttl{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .l2{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);font-family:ui-monospace,monospace}
.tk .l2 .meta2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{display:block;height:3px;border-radius:2px;background:var(--panel2);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent-line)}
.pdots{display:flex;gap:2px;flex:0 0 auto}
.pdots i{width:6px;height:3px;background:var(--panel2);border-radius:1px}
.pdots i.on{background:var(--accent-line)}
.progbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:1px 7px;font:inherit;font-size:10px;cursor:pointer}
/* 抽屉：决策面（要你签的那件事 + 回执 + 变更 + 时间线） */
.decide{border:1px solid var(--amber);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12px}
.decide b{display:block;margin-bottom:3px}
.kv2{display:grid;grid-template-columns:110px 1fr;gap:2px 10px;font-size:12px;margin-top:10px}
.kv2 .k{color:var(--muted);font-size:11px}
.tl{margin:10px 0 0;padding-left:0;list-style:none;font-size:12px}
.tl li{display:flex;gap:8px;padding:3px 0;color:var(--fg-soft)}
.tl .at{color:var(--muted);font-size:11px;font-family:ui-monospace,monospace;flex:0 0 auto}
.arrows{flex:0 0 auto;display:flex;gap:2px;margin-top:1px}
.arrows button{border:0;background:transparent;color:var(--faint);cursor:pointer;font:inherit;font-size:11px;padding:0 2px;border-radius:4px}
.tk:hover .arrows button{color:var(--muted)}
.arrows button:hover{color:var(--blue);background:var(--panel2)}
/* ---- right: executor panel ---- */
.main{overflow-y:auto;padding:18px clamp(16px,2vw,28px) 40px}
.grow{flex:1}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.top h1{font-size:14px;font-weight:600;margin:0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px}
.chip.warn{border-color:var(--amber);color:var(--amber);background:var(--warn-soft)}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;width:max-content;margin:0 0 14px;flex-wrap:wrap}
.seg label{padding:5px 12px;border-radius:7px;color:var(--muted);font-size:12px}
.seg label.on{background:var(--panel2);color:var(--fg)}
.strip{display:flex;align-items:center;gap:10px;padding:9px var(--gx);border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px;color:var(--muted);margin:0 0 var(--cardgap);flex-wrap:wrap}
.strip .live{color:var(--green)}
.power{border:1px solid var(--line);border-radius:7px;padding:5px 12px;font:inherit;cursor:pointer;background:var(--panel2);color:var(--fg)}
.openBtn{border:1px solid var(--line);border-radius:7px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;background:var(--panel2);color:var(--fg)}
.sect{margin:var(--sectgap) 0 8px;padding-left:var(--gx);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sect.first{margin-top:0}
.sect .meta{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:var(--gy) var(--gx);margin:0 0 var(--cardgap)}
.line{display:flex;align-items:center;gap:10px;font-size:12px}
.line .lab{color:var(--muted)}
.line .sep{color:var(--faint)}
.line .live b{font-weight:600}
.stepper{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.stepper button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1;width:26px;height:24px;cursor:pointer;border-radius:6px}
.stepper button:hover{background:var(--hover);color:var(--blue)}
.stepper button:disabled{color:var(--faint);cursor:not-allowed;background:transparent}
.stepper .val{min-width:32px;text-align:center;font-weight:600}
.req{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;margin-bottom:var(--cardgap)}
.req .h{display:flex;align-items:baseline;gap:8px;padding:9px var(--gx);cursor:pointer}
.req .h:hover{background:var(--hover)}
.req .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req .id{color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}
.req .meta{color:var(--muted);font-size:11px;white-space:nowrap}
.foot{margin:24px 0 0;padding-left:var(--gx);color:var(--muted);font-size:11px}
/* 主区视图：工单板 / 立项单 / 读面 */
.vhead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.vhead h1{font-size:14px;font-weight:600;margin:0}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px var(--gx);margin-bottom:var(--cardgap);cursor:pointer}
.bcard:hover{background:var(--hover)}
.bcard .r1{display:flex;align-items:baseline;gap:8px}
.bcard .r1 .id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.bcard .r1 .ttl{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .r2{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
.bcard .bar{height:3px;border-radius:2px;background:var(--panel2);margin-top:8px;overflow:hidden}
.bcard .bar i{display:block;height:100%;background:var(--accent-line)}
.filters{display:flex;gap:6px;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:11px;cursor:pointer}
.filters button[data-on="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.ep{display:flex;align-items:baseline;gap:10px;padding:9px var(--gx);border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:var(--cardgap)}
.ep .code{font-weight:600;font-size:13px}
.ep .st{color:var(--muted);font-size:11px}
.ep .n{margin-left:auto;color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
.ep .go{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;padding:3px 9px;font:inherit;font-size:11px;cursor:pointer}
/* 票详情：住主区（中栏），右栏 chat 永不被占用 */
.back{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:10px}
.dh{display:flex;align-items:baseline;gap:8px}
.dh .id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.dh h2{font-size:14px;margin:0;flex:1;min-width:0}
.acts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;padding:5px 12px;font:inherit;cursor:pointer}
.acts button.pri{background:var(--accent-soft);border-color:var(--accent-line)}
.steps{margin-top:14px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;color:var(--muted)}
.step.done .dot{background:var(--green)}
.step.now .dot{background:var(--blue)}
.step .dot{width:7px;height:7px;border-radius:50%;background:var(--panel2);flex:0 0 auto}
/* 右栏 chat */
.chat{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.chatHead{display:flex;align-items:center;gap:8px;padding:10px var(--gx);border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
.chatHead .chip{margin-left:auto;font-weight:400}
.chatBody{flex:1;overflow-y:auto;padding:12px}
.msg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px;background:var(--bg)}
.msg.me{margin-left:36px}
.msg.them{margin-right:36px}
.chatFoot{display:flex;gap:8px;padding:10px var(--gx);border-top:1px solid var(--line)}
.chatFoot input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:6px 9px;font:inherit}
</style>
</head>
<body>
<div class="shell">
  <div class="side">
    <div class="sideHead"><span class="t">Projects</span>
      <button class="progbtn" id="progBtn" onclick="cycleProg()" title="Progress shown per ticket: dots / bar / off">dots</button>
      <span class="n" id="sideN">3 projects</span></div>
    <div class="sideBody" id="projList"></div>
  </div>

  <div class="main" id="main"></div>

  <div class="chat">
    <div class="chatHead">Chat<span class="chip">session-09ca0247</span></div>
    <div class="chatBody">
      <div class="msg them">t261004-18 is at the merge gate. The merge check is green; sign it or send it back.</div>
      <div class="msg me">let me look at the diff first</div>
      <div class="msg them">The lane changes 3 files: the write gate, the refusal copy, and two unit tests.</div>
    </div>
    <div class="chatFoot"><input placeholder="Message the session"><button class="power">Send</button></div>
  </div>

  <template id="tpl-executor">
    <div class="top">
      <h1>Executor</h1><span class="chip" id="projChip">sandbar</span>
      <span class="grow"></span>
      <button class="power" onclick="toggleTheme()">Light / dark</button>
    </div>

    <div class="seg">
      <label class="on">Overview</label><label>Grants</label><label>Alerts</label><label>Ledger</label><label>Settings</label><label>Inspection</label>
    </div>

    <div class="strip">
      <span class="live">● live</span>
      <span>The executor is working.</span>
      <span class="chip">Permissions: 5 of 6</span>
      <span class="chip">Session: session-09ca0247</span>
      <button class="openBtn">Open session</button>
      <button class="power" style="margin-left:auto">Disable executor</button>
    </div>

    <div class="sect first">Running tickets <span class="chip" id="stateChip">at the limit</span><span class="meta" id="limitMeta">set by you 10-04 14:02</span></div>
    <div class="card">
      <div class="line">
        <span class="lab">Limit</span>
        <span class="stepper">
          <button id="minus" onclick="bump(-1)">−</button>
          <span class="val" id="cap">3</span>
          <button id="plus" onclick="bump(1)">+</button>
        </span>
        <span class="sep">·</span>
        <span class="live"><b id="atWork">3</b> in flight</span>
        <span class="sep">·</span>
        <span class="live"><b id="queued">4</b> waiting</span>
        <span class="grow"></span>
        <button class="power" onclick="save()">Save</button>
      </div>
    </div>

    <div class="sect">Needs your answer · 2</div>
    <div class="req"><div class="h"><span class="txt">May the executor open tickets for the inspection epic?</span><span class="id">#a3f2</span><span class="meta">decision · 12 min</span></div></div>
    <div class="req"><div class="h"><span class="txt">Open a small fix ticket for the Chinese alert copy?</span><span class="id">#b7c1</span><span class="meta">finding · 4 min</span></div></div>

    <div class="foot">Mock. No backend. Sample data.</div>
  </template>
</div>

<script>
// 每个项目自己一套：上限 + 队列。run=在跑／hold=等你签字（也占额度）／wait=排队（顺序＝启动顺序）／paused=你暂停的（不占）
const PROJECTS = {
  sandbar: { cap: 3, tickets: [
    {id:'t261004-18', title:'Panel write endpoints carry no identity', stage:'merge', epic:'project-executor', st:'hold'},
    {id:'t261004-17', title:'A request must be answerable', stage:'implement', epic:'project-executor', st:'run'},
    {id:'t261004-25', title:'Inspection 20261004 · integration-tests', stage:'report', epic:'inspection', st:'run'},
    {id:'t261004-22', title:'Wait for the condition instead of a fixed sleep', stage:'design_integration_tests', epic:'engine-hardening', st:'wait'},
    {id:'t261004-24', title:'Console-visible copy in Chinese', stage:'create_plan', epic:'localization', st:'wait'},
    {id:'t261004-20', title:'Anchor audit for test assertions', stage:'design_integration_tests', epic:'engine-hardening', st:'wait'},
    {id:'t261004-23', title:'Give the executor an engine-side way to raise a request', stage:'create_plan', epic:'project-executor', st:'wait'},
    {id:'t261004-19', title:'Open-ticket authority is scoped by epic', stage:'create_plan', epic:'project-executor', st:'paused'},
  ]},
  suyou: { cap: 2, tickets: [
    {id:'t260904-02', title:'Cover the metrics API contract', stage:'implement', epic:'metrics', st:'run'},
    {id:'t260905-01', title:'Panel list conventions', stage:'merge', epic:'doc-lifecycle', st:'hold'},
    {id:'t260905-06', title:'Index the new reference page', stage:'create_plan', epic:'doc-lifecycle', st:'wait'},
  ]},
  nusuyou: { cap: 1, tickets: [
    {id:'t260930-04', title:'cs-publish pipeline: retry on 429', stage:'run_integration_tests', epic:'content', st:'run'},
    {id:'t260930-07', title:'Site rebuild for the new hero', stage:'create_plan', epic:'content', st:'wait'},
    {id:'t260930-09', title:'Move assets to the CDN', stage:'create_plan', epic:'content', st:'wait'},
  ]},
};
const STEPS = ['create_plan','review_plan','implement','design_integration_tests','ui_evidence','run_integration_tests','arbitrate','acceptance_walkthrough','merge_check','merge'];
const stepIdx = t => Math.max(0, STEPS.indexOf(String(t.stage).split(' ')[0]));
let cur = 'sandbar', dragId = null, view = 'ticket', prevView = 'executor', filter = 'all', openId = 't261004-18', prog = 'dots';
function cycleProg(){ prog = prog === 'dots' ? 'bar' : prog === 'bar' ? 'off' : 'dots'; const b = document.getElementById('progBtn'); if (b) b.textContent = prog; render(); }
const T = () => PROJECTS[cur].tickets;
const pctOf = t => Math.round((stepIdx(t) + (t.st === 'wait' ? 0 : 0.5)) / STEPS.length * 100);
function pdots(t){
  if (prog !== 'dots') return '';
  const i = stepIdx(t);
  return '<span class="pdots">' + STEPS.map((s, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join('') + '</span>';
}
function pbar(t){
  if (prog !== 'bar') return '';
  return '<span class="pbar"><i style="width:' + pctOf(t) + '%"></i></span>';
}
const inFlight = () => T().filter(t => t.st === 'run' || t.st === 'hold').length;
const waitCount = () => T().filter(t => t.st === 'wait').length;
const TICKET = id => { for (const k in PROJECTS) { const t = PROJECTS[k].tickets.find(x => x.id === id); if (t) return Object.assign({ project: k }, t) } return null; };

function render(){ renderSide(); renderMain(); }

function renderSide(){
  const counts = Object.keys(PROJECTS).map(k => ({
    k,
    run: PROJECTS[k].tickets.filter(t => t.st === 'run' || t.st === 'hold').length,
    wait: PROJECTS[k].tickets.filter(t => t.st === 'wait').length,
  }));
  document.getElementById('sideN').textContent = counts.length + ' projects';
  document.getElementById('projList').innerHTML = counts.map(({k, run, wait}) => {
    let q = 0;
    const rows = PROJECTS[k].tickets.map(t => {
      const fixed = t.st !== 'wait';
      const prefix = t.st === 'wait' ? '<span class="pos">' + (++q) + '</span>'
        : '<span class="mark ' + (t.st === 'run' ? 'run' : t.st === 'hold' ? 'hold' : 'paused') + '"></span>';
      const arrows = fixed ? '' : '<span class="arrows"><button onclick="event.stopPropagation();move(\'' + k + '\',\'' + t.id + '\',-1)">⌃</button><button onclick="event.stopPropagation();move(\'' + k + '\',\'' + t.id + '\',1)">⌄</button></span>';
      const hi = (k === cur && openId === t.id) ? ' sel' : '';
      return '<div class="tk' + (fixed ? ' fixed' : '') + hi + '" data-id="' + t.id + '" draggable="' + (!fixed) + '" onclick="pickProject(\'' + k + '\');openTicket(\'' + t.id + '\')">'
        + '<span class="grip">⋮⋮</span>' + prefix
        + '<span class="body"><span class="l1"><span class="id">' + t.id + '</span><span class="ttl">' + t.title + '</span></span>'
        + '<span class="l2"><span class="meta2">' + t.stage + ' · ' + t.epic + '</span>' + pdots(t) + '</span>'
        + pbar(t) + '</span>' + arrows + '</div>';
    }).join('');
    const icon = (v, glyph, title) => '<span class="vi' + (k === cur && view === v ? ' on' : '') + '" title="' + title
      + '" onclick="pickProject(\'' + k + '\');setView(\'' + v + '\')">' + glyph + '</span>';
    return '<div class="proj" data-open="' + (k === cur) + '" data-key="' + k + '">'
      + '<div class="prow" onclick="pickProject(\'' + k + '\')"><span class="pname">' + k + '</span>'
      + '<span class="views" onclick="event.stopPropagation()">'
      + icon('board', '▤', 'Ticket board') + icon('epics', '◆', 'Epics') + icon('executor', '▶', 'Executor panel')
      + icon('more', '⋯', 'More: Docs; model routes and settings moved into the panel') + '</span>'
      + '<span class="pmeta">' + (run + wait === 0 ? '—' : run + ' in flight · ' + wait + ' waiting') + '</span>'
      + '<span class="chev">▸</span></div><div class="plist">' + rows + '</div></div>';
  }).join('');
  wire();
}

function renderMain(){
  const el = document.getElementById('main');
  if (view === 'ticket'){ el.innerHTML = ticketView(); return; }
  if (view === 'executor'){
    el.innerHTML = '';
    el.appendChild(document.getElementById('tpl-executor').content.cloneNode(true));
    paintExecutor();
    return;
  }
  const title = view === 'board' ? 'Ticket Board' : view === 'epics' ? 'Epics' : 'More';
  const head = '<div class="vhead"><h1>' + title + '</h1><span class="chip">' + cur + '</span></div>';
  if (view === 'board'){
    const rows = T().filter(t => filter === 'all' ? true : filter === 'wait' ? t.st === 'wait' : (t.st === 'run' || t.st === 'hold'))
      .map(t => {
        const pct = t.st === 'wait' ? 20 : t.st === 'hold' ? 60 : t.st === 'run' ? 80 : 40;
        const label = t.st === 'run' ? 'at work' : t.st === 'hold' ? 'waiting for you' : t.st === 'wait' ? 'queued' : 'paused';
        return '<div class="bcard" onclick="openTicket(\'' + t.id + '\')"><div class="r1"><span class="id">' + t.id + '</span>'
          + '<span class="ttl">' + t.title + '</span></div>'
          + '<div class="r2"><span>' + t.stage + '</span><span>·</span><span>' + t.epic + '</span>'
          + '<span style="margin-left:auto">' + label + '</span></div>'
          + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      }).join('');
    el.innerHTML = head + '<div class="filters">'
      + '<button data-on="' + (filter === 'all') + '" onclick="setFilter(\'all\')">All ' + T().length + '</button>'
      + '<button data-on="' + (filter === 'wait') + '" onclick="setFilter(\'wait\')">Queued ' + waitCount() + '</button>'
      + '<button data-on="' + (filter === 'live') + '" onclick="setFilter(\'live\')">In flight ' + inFlight() + '</button></div>' + rows;
    return;
  }
  if (view === 'epics'){
    const codes = [...new Set(T().map(t => t.epic))];
    el.innerHTML = head + codes.map(c => {
      const n = T().filter(t => t.epic === c).length;
      return '<div class="ep"><span class="code">' + c + '</span><span class="st">active</span>'
        + '<span class="n">' + n + ' ticket' + (n > 1 ? 's' : '') + '</span>'
        + '<button class="go" onclick="filterEpic(\'' + c + '\')">Filter the list</button></div>';
    }).join('');
    return;
  }
  el.innerHTML = head
    + '<div class="ep"><span class="code">Docs</span><span class="st">read-only library</span><span class="n">docs/ + notes/</span><span class="go">Open</span></div>'
    + '<div class="ep"><span class="code">Model routes</span><span class="st">moved into the panel</span><span class="n">Settings tab</span><span class="go" onclick="setView(\'executor\')">Go</span></div>'
    + '<div class="ep"><span class="code">Project settings</span><span class="st">moved into the panel</span><span class="n">Settings tab</span><span class="go" onclick="setView(\'executor\')">Go</span></div>';
}

// 驾驶舱里的动态数字（模板克隆之后才有这些元素）
function paintExecutor(){
  const cap = PROJECTS[cur].cap, n = inFlight();
  document.getElementById('projChip').textContent = cur;
  document.getElementById('atWork').textContent = n;
  document.getElementById('queued').textContent = waitCount();
  document.getElementById('cap').textContent = cap === null ? 'Unlimited' : cap;
  document.getElementById('minus').disabled = cap === 1;
  const over = cap !== null && n > cap;
  const chip = document.getElementById('stateChip');
  chip.className = 'chip' + (over ? ' warn' : '');
  chip.textContent = cap === null ? 'no limit' : over ? 'over the limit' : (n >= cap ? 'at the limit' : 'room to start one');
}

function ticketView(){
  const t = openId ? TICKET(openId) : null;
  if (!t) return '<button class="back" onclick="goBack()">← Back</button><div class="vhead"><h1>Ticket</h1></div>';
  const steps = ['create_plan','review_plan','implement','design_integration_tests','ui_evidence','run_integration_tests','arbitrate','acceptance_walkthrough','merge_check','merge'];
  const at = steps.indexOf(String(t.stage).split(' ')[0]);
  const label = t.st === 'run' ? 'at work' : t.st === 'hold' ? 'waiting for your signature' : t.st === 'wait' ? 'queued' : 'paused by you';
  const decide = t.st === 'hold'
    ? '<div class="decide"><b>Waiting for you: sign the merge</b>'
      + 'Merge this lane into main. The merge check is green (all four items). '
      + 'Send it back instead if the diff is wrong.</div>'
    : t.st === 'run'
      ? '<div class="decide" style="border-color:var(--accent-line);background:var(--accent-soft)"><b>At work: ' + t.stage + '</b>'
        + 'A check or an agent is running. Nothing to decide yet.</div>'
      : '<div class="decide" style="border-color:var(--line);background:var(--panel)"><b>'
        + (t.st === 'wait' ? 'Queued, position ' + (T().filter(x => x.st === 'wait').findIndex(x => x.id === t.id) + 1) : 'Paused by you')
        + '</b>' + (t.st === 'wait' ? 'It starts when a slot frees. Nothing to decide yet.' : 'It stops after the current stage ends.') + '</div>';
  return '<button class="back" onclick="goBack()">← Back</button><div class="dh"><span class="id">' + t.id + '</span><h2>' + t.title + '</h2>'
    + '<button class="x" onclick="openTicket(null)">×</button></div>'
    + '<div class="acts"><button class="pri">Sign</button><button>Send back</button><button>Retry check</button><button>Pause</button></div>'
    + decide
    + '<div class="kv2"><span class="k">Project</span><span>' + t.project + '</span>'
    + '<span class="k">Epic</span><span>' + t.epic + '</span>'
    + '<span class="k">Stage</span><span>' + t.stage + '</span>'
    + '<span class="k">State</span><span>' + label + '</span>'
    + '<span class="k">Changes</span><span>3 files · +128 −12 (lane vs main)</span>'
    + '<span class="k">Last receipt</span><span>' + (t.st === 'wait' ? 'none yet' : 'merge_check: 4 of 4 green · 2 min ago') + '</span></div>'
    + '<div class="steps">' + steps.map((s, i) => '<div class="step ' + (i < at ? 'done' : i === at ? 'now' : '') + '"><span class="dot"></span>' + s + '</div>').join('') + '</div>'
    + '<ul class="tl">'
    + '<li><span class="at">14:02</span><span>you paused the ticket before it advanced</span></li>'
    + '<li><span class="at">13:52</span><span>merge_check: lane branch has commits, tree clean, dry run green</span></li>'
    + '<li><span class="at">13:40</span><span>implement: ' + (t.st === 'wait' ? 'not started' : 'handoff written, 3 files changed') + '</span></li>'
    + '</ul>'
    + '<div class="foot">Details live in the middle column. The right column stays chat.</div>';
}

function move(k, id, d){
  const arr = PROJECTS[k].tickets;
  const i = arr.findIndex(t => t.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= arr.length) return;
  if (arr[i].st !== 'wait' || arr[j].st !== 'wait') return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  render();
}
function pickProject(k){ cur = k; dragId = null; openId = null; render(); }
function setView(v){ view = v; openId = null; render(); }
function setFilter(f){ filter = f; render(); }
function filterEpic(code){ view = 'board'; filter = 'all'; const i = T().findIndex(t => t.epic === code); openId = i >= 0 ? T()[i].id : null; render(); }
function openTicket(id){ if (view !== 'ticket') prevView = view; openId = id; view = 'ticket'; render(); }
function goBack(){ view = prevView || 'board'; openId = null; render(); }
function bump(d){
  const key = cur, c = PROJECTS[key].cap;
  if (d > 0) PROJECTS[key].cap = (c === null) ? null : (c >= 10 ? null : c + 1);
  else if (c === null) PROJECTS[key].cap = 10;
  else if (c > 1) PROJECTS[key].cap = c - 1;
  render();
}
function save(){ const m = document.getElementById('limitMeta'); if (m) m.textContent = 'set by you just now'; }
function toggleTheme(){ const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; }
function wire(){
  document.querySelectorAll('.tk[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => { e.stopPropagation(); dragId = el.dataset.id; el.dataset.drag = 'true' });
    el.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.tk').forEach(x => { x.dataset.drag = 'false'; x.dataset.over = 'false' }) });
    el.addEventListener('dragover', e => { e.preventDefault(); el.dataset.over = 'true' });
    el.addEventListener('dragleave', () => { el.dataset.over = 'false' });
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); el.dataset.over = 'false';
      if (!dragId || dragId === el.dataset.id) return;
      const arr = T();
      const from = arr.findIndex(t => t.id === dragId), to = arr.findIndex(t => t.id === el.dataset.id);
      if (arr[from].st !== 'wait' || arr[to].st !== 'wait') return;
      const row = arr.splice(from, 1)[0];
      arr.splice(to, 0, row);
      render();
    });
  });
}
render();
</script>
