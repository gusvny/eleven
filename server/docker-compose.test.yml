# sandbar Docker 测试环境（M17 建，t260904-19 参数化）—— 独立 Temporal + 独立 dsh 实例
# + 独立端口。本文件是全仓唯一测试舞台声明：场景台与供给台都经 integration/stage_docker.py
# 搭建（勿手写 docker compose 命令），自搭进程舞台（随机端口临时控制台/槽位 temporalite）
# 已随 t260904-19 退役。
#
# 铁律：生产（本机直跑）的端口一律不碰——3099 dsh 控制台 / 7233 Temporal gRPC / 8233
# Temporal UI。本文件全部端口独立且只绑 127.0.0.1（本机测试环境，不暴露局域网）。
#
#   生产 Temporal：gRPC 7233 / Web UI 8233（engine/run_server.sh）
#   测试 Temporal：gRPC 17233 / Web UI 18233（容器内 7233 / 8233）
#   生产 dsh 控制台：3099（start-console.sh）
#   测试 dsh 控制台：3199（本文件 dsh 服务缺省映射）
#
# 缺省（不带任何 SANDBAR_TEST_* env 直接 up）行为：同名容器（sandbar-test-*）、
# 同端口（3199/17233/18233）、同卷、namespace sandbar-test——docs/testing-guide.md
# 的拓扑/容器名锚零漂移。t260912-02 一处例外：default 网络显式指定子网（见文件尾
# networks 块），缺省落受管网段表 10.213.0.0/16 的保留尾槽 10.213.255.0/24——
# 单台手工直跑照常可用；并行/爆发起台一律走 stage_docker（每台分配互异槽位，
# 建网不再撞 docker 分配器库存）；两个手工台同起会撞保留槽，手工并行请显式传
# SANDBAR_TEST_SUBNET=10.213.x.0/24（x 不取保留槽）。
#
# 并行实例（t260904-19）：每个舞台独立 compose 工程名 + 独立端口档 + 独立容器名/卷
# 前缀。全部分配逻辑（档位 flock 原子预留、生产/缺省台端口禁区排除、健康探针、
# teardown 零残留核验）在 integration/stage_docker.py 单点实现：
#   python3 integration/stage_docker.py up --project <唯一名>            # 起台（stdout 回 JSON）
#   python3 integration/stage_docker.py down --project <名>              # 拆台（幂等，零残留核验）
#   python3 integration/stage_docker.py ensure --project <名> --keep     # 幂等确保（供给台用）
#
# 批级共享台（t260921-06）：一次集成测试跑批经 `up/ensure --kind batch` 预起恰 1 个
# temporal 容器（+1 卷 +1 网，工程名 batch-<runid8>-<pwdhash8>），批内场景按
# namespace 隔离复用（stage_docker ns-acquire/ns-drop；SANDBAR_STAGE_BATCH 注入面），
# 批终 down 全灭零残留。--kind batch 与 --keep 互斥（拒常驻化=拒「整机共享」退化，
# 宿主令 260921）。本文件本体零改动：批台=同一 compose 服务的普通单台实例，只是
# 生命周期纪律不同（批终即拆；消费面见 integration/README.md 批级共享台节）。
#
# env 旋钮（stage_docker 注入；手工调用也可设，缺省值=原行为）：
#   SANDBAR_TEST_CONSOLE_PORT / _TEMPORAL_PORT / _TEMPORAL_UI_PORT   宿主端口（3199/17233/18233）
#   SANDBAR_TEST_TEMPORAL_NAME / _DSH_NAME                           容器名（并行必给唯一值）
#   SANDBAR_TEST_REPO_DIR                                            挂进 /repo 的仓根（缺省 ../..）
#   SANDBAR_TEST_FIXTURES_DIR                                        场景夹具根，挂 /fixtures（rw）
#   SANDBAR_TEST_PROFILE_DIR                                         预组 profile 根，挂 /profile（ro）
#   SANDBAR_TEST_PROFILE / _PROFILE_SRC                              profile 名与链接源（容器内路径）
#   SANDBAR_TEST_NAMESPACE / _PROJECTS_DIR / _TARGET_HOST            Temporal namespace / 注册表根 / 引擎地址
#
# 详细指南（怎么验证、怎么跑 worker/自测、故障排查）见 server/TESTING.md。
# 两服务镜像均本机自建、无 registry 拉取：test-temporal=sh server/build-test-temporal.sh；
# test-dsh=sh server/build-test-dsh.sh（建镜像时联网一次，之后起台零网络）。
# 第三镜像（t260913-04，不属任何 compose 服务——引擎「每票一容器」agent 执行面基座，
# 由引擎 agent_runtime 按 SANDBAR_AGENT_RUNTIME=docker 直接 run，缺省 tag
# sandbar-agent:dsh-0.1.1-rc.2-s1）：sandbar-agent=sh server/engine/build_agent_image.sh；
# 回归台经 stage_docker 镜像门 opt-in 校验（SANDBAR_REQUIRE_AGENT_IMAGE=1，缺=ENV_FAIL
# exit 2 点名构建命令）。

services:
  # ---- 独立 Temporal（temporalite dev server，SQLite 落盘，与 engine 同款免 postgres）----
  # 与生产（7233/8233）完全隔离：独立容器、独立端口映射、独立数据卷、独立 namespace。
  # 注意：temporalite 无 --search-attribute 启动参数。多项目化的 ProjectKey SA 与
  # 立项关联的 EpicCode SA 在新数据卷首次 up 后于本机注册一次（落数据卷，之后重启自带；
  # stage_docker up 会对新卷自动补注册）：
  #   server/engine/bin/temporal operator search-attribute create \
  #     --name ProjectKey --type Keyword --namespace sandbar-test --address 127.0.0.1:17233
  #   server/engine/bin/temporal operator search-attribute create \
  #     --name EpicCode --type Keyword --namespace sandbar-test --address 127.0.0.1:17233
  # 保留期同理（temporalite 默认 24h，关闭的 workflow 会被物理删除）首次 up 后设置一次：
  #   server/engine/bin/temporal operator namespace update \
  #     --retention 876000h --namespace sandbar-test --address 127.0.0.1:17233
  temporal:
    # 自造镜像（temporalite 上游已归档）：官方 temporal CLI 内嵌 dev server，
    # 与本仓 bin/temporal 同版；重建=sh server/build-test-temporal.sh
    image: test-temporal:cli-1.8.3
    container_name: ${SANDBAR_TEST_TEMPORAL_NAME:-sandbar-test-temporal}
    # 镜像自带 entrypoint 是 `temporalite start --ephemeral ...`（数据不落盘），
    # 这里显式覆盖：namespace=sandbar-test + SQLite 落盘到 /data（数据卷持久化）。
    entrypoint: ["/temporal", "server", "start-dev"]
    # 旗标与 temporalite 同名同义（--namespace/--ip/--port/--ui-port/--db-filename），
    # 子命令是 start-dev（start 不存在——cobra 会打组帮助假旗标表，别被骗）。
    command:
      - --namespace
      - ${SANDBAR_TEST_NAMESPACE:-sandbar-test}
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:${SANDBAR_TEST_TEMPORAL_PORT:-17233}:7233"    # 测试 Temporal gRPC（宿主 → 容器 7233）
      - "127.0.0.1:${SANDBAR_TEST_TEMPORAL_UI_PORT:-18233}:8233" # 测试 Temporal Web UI（宿主 → 容器 8233）
    volumes:
      - temporal-data:/data
    restart: "no"   # t260904-19：舞台生命周期归 stage_docker 管（up/down 显式），不做守护自启

  # ---- 独立 dsh 测试控制台（缺省 3199）----
  # 与生产同构：DSH_HOME 独立卷 + profile 装配（t260904-19 gen2：profile **拷贝**进卷，
  # 不再软链——dsh prepareProfile 要向 profile 目录写 cordis.yml 合成产物，软链指向
  # :ro 的 /repo 时写穿=EROFS crash loop，真容器实锤）；泳道场景经
  # SANDBAR_TEST_PROFILE_DIR 挂预组 profile、_PROFILE_SRC 改拷贝源（同为容器内路径）。
  # 容器内只跑控制台 UI / 工单台（workbench 的 admin.py spawn 需要 python3，apt 兜底装）；
  # Temporal SDK 工具（worker / demo / selfcheck）一律在本机跑、用环境变量指向测试
  # Temporal（见 TESTING.md）——engine/.venv 不在容器里。
  dsh:
    # 自造镜像（test-dsh）：node:22-bookworm 基座（node>=22.19，dsh@0.1.1-rc.2 传递
    # 依赖要求）+ dsh 烤进层，起台秒级零联网。此前直接跑 node:22-bookworm、每次
    # 容器启动 npm 装全局 dsh——456 包每台全网重下 ~2 分钟（可写层随拆台即弃、
    # npm 缓存留不住，「首次联网」实为「每次」，260908 慢场景解剖实锤）；
    # 重建=sh server/build-test-dsh.sh（dsh 升版三处同步：脚本+Dockerfile+本行）。
    image: test-dsh:dsh-0.1.1-rc.2
    container_name: ${SANDBAR_TEST_DSH_NAME:-sandbar-test-dsh}
    working_dir: /repo
    environment:
      DSH_HOME: /dsh-home
      SANDBAR_TARGET_HOST: ${SANDBAR_TEST_TARGET_HOST:-temporal:7233}    # 引擎地址（dsh-only 台=死端口 127.0.0.1:1）
      SANDBAR_NAMESPACE: ${SANDBAR_TEST_NAMESPACE:-sandbar-test}
      SANDBAR_PROJECTS_DIR: ${SANDBAR_TEST_PROJECTS_DIR:-/nonexistent} # 场景注入注册表根（容器内路径）
      SANDBAR_TEST_PROFILE: ${SANDBAR_TEST_PROFILE:-sandbar}
      SANDBAR_TEST_PROFILE_SRC: ${SANDBAR_TEST_PROFILE_SRC:-/repo/server/profile}
      # GUI 模型供给旋钮（见 command 内注释）：空值=不干预（产品默认原样拷贝）
      SANDBAR_TEST_GUI_MODEL: ${SANDBAR_TEST_GUI_MODEL:-}
    volumes:
      - ${SANDBAR_TEST_REPO_DIR:-../..}:/repo:ro     # 仓根（缺省=仓库根，向上两级）
      - dsh-home:/dsh-home
      - ${SANDBAR_TEST_FIXTURES_DIR:-/tmp/sandbar-stage-fixtures}:/fixtures   # 场景夹具根（rw：容器内 CLI 会写注册表）
      - ${SANDBAR_TEST_PROFILE_DIR:-/tmp/sandbar-stage-profile}:/profile:ro   # 预组 profile（ro）
      - ${SANDBAR_TEST_NM_REPO_DIR:-/tmp/sandbar-stage-nm}:/repo-nm:ro       # 插件依赖树（gen2：与被测树解耦——/repo=被测 workbench 所在树，/repo-nm=profile/node_modules 装齐的树，缺省=主树）
      # admin.py 审计日志遮蔽（gen2 真容器实锤：tools_registry 硬编码写 <repo>/server/admin.log，
      # 两棵 repo 树 :ro → EROFS → UI 轮询面 502）。单文件 bind 到可写 tmp 文件（宿主须先
      # touch 存在，stage_docker 负责预创建；手动 compose 用户先 `touch /tmp/sandbar-stage-admin.log`）。
      # 容器写的是每台独立的 tmp 副本，主树/泳道真 admin.log 不被测试触碰。
      # 凭据物化（gen4：容器台无凭据→dsh 壳层准入遮罩全屏拦截指针→弹层输入链路死；
      # 自搭台拷凭据所以无此现象——对照实锤）。stage_docker 负责预创建文件。
      - ${SANDBAR_TEST_CREDENTIALS:-/tmp/sandbar-stage-credentials}:/dsh-home/.credentials.yaml
      # agent preset 物化（gen6 实锤：会话创建=agent-preset-not-found「sandbar-integration」；
      # 自搭台从宿主 ~/.dsh/.agent-presets 物化，容器台同口径——stage_docker 拷宿主目录
      # 到 tmp 再 bind，缺失时=空目录（preset 缺失诚实呈现，不假绿）。
      - ${SANDBAR_TEST_AGENT_PRESETS:-/tmp/sandbar-stage-agent-presets}:/dsh-home/.agent-presets
      - ${SANDBAR_TEST_ADMIN_LOG:-/tmp/sandbar-stage-admin.log}:/repo-nm/server/admin.log
      - ${SANDBAR_TEST_ADMIN_LOG:-/tmp/sandbar-stage-admin.log}:/repo/server/admin.log
    ports:
      - "127.0.0.1:${SANDBAR_TEST_CONSOLE_PORT:-3199}:3199"
    command:
      - /bin/sh
      - -ec
      - |
        set -eu
        if ! command -v dsh >/dev/null 2>&1; then
          npm i -g --no-audit --no-fund @deepseek-ai/dsh@0.1.1-rc.2
        fi
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
        fi
        mkdir -p "$$DSH_HOME/profiles/$$SANDBAR_TEST_PROFILE"
        # profile 装配=拷贝+软链混合（gen2 EROFS 修复）：
        # - 顶层文件/目录（cordis*.yml/sandbar-tools.ts/package.json）拷进 dsh-home 卷
        #   （rw）——prepareProfile 的 cordis.yml 合成写落卷内，不写穿 :ro 的 /repo；
        #   每次容器启动重拷=随仓更新，无需重建台。GNU cp -r 保顶层软链（预组 profile
        #   的 sandbar-tools.ts 软链目标是容器内绝对路径，保形即有效）。
        # - node_modules 保持软链（不拷：主树插件依赖树大，拷贝分钟级；且 dsh 启动
        #   自愈农场写的是 profiles/node_modules 兄弟位，不经 profile 源内）。
        cd "$$SANDBAR_TEST_PROFILE_SRC"
        for f in "$$SANDBAR_TEST_PROFILE_SRC"/*; do
          case "$${f##*/}" in node_modules) continue ;; esac
          cp -r "$$f" "$$DSH_HOME/profiles/$$SANDBAR_TEST_PROFILE/"
        done
        # GUI 会话模型供给旋钮（测试台面；260908：deepseek 账户欠费 → 台内 turn
        # error 会把用户消息行回滚掉，依赖消息渲染的 chat tag 场景恒红。产品默认
        # 在 server/profile/cordis.patch.yml 不动——本旋钮只在测试 env 显式设置时
        # 改台内拷贝（每次启动重拷=幂等）。值形 "provider/model"（kimi-coding/k3
        # 为实测健康路）。SANDBAR_TEST_GUI_MODEL=kimi-coding/k3
        if [ -n "$${SANDBAR_TEST_GUI_MODEL:-}" ]; then
          prov=$${SANDBAR_TEST_GUI_MODEL%%/*}; mod=$${SANDBAR_TEST_GUI_MODEL##*/}
          sed -i \
            -e "/- id: agent-default-model/,/^  - id:/ s/    provider: .*/    provider: $$prov/" \
            -e "/- id: agent-default-model/,/^  - id:/ s/    model: .*/    model: $$mod/" \
            "$$DSH_HOME/profiles/$$SANDBAR_TEST_PROFILE/cordis.patch.yml"
          # pi-ai catalog 路由只缺 key 名引用（model-routes.yaml 同款：kimi-coding=
          # anthropic-messages/api.kimi.com/coding，catalog 自带 k3）。新卷 settings
          # 恒空 → 目录恒空、composer 恒 disabled（260908 重建台实锤），故非 catalog
          # 内置的 provider 必须随旋钮补这条 profile 补丁；catalog 自带模型清单，
          # 补丁只需给 key 名引用、不必列 models。
          if [ "$$prov" != "deepseek-official" ]; then
            printf '%s\n' \
              '- id: llm-pi-ai' \
              '  config:' \
              '    providers:' \
              "      $$prov:" \
              '        apiKeyEnv: KIMI_API_KEY' \
              >> "$$DSH_HOME/profiles/$$SANDBAR_TEST_PROFILE/cordis.patch.yml"
          fi
        fi
        # 插件依赖面（gen4 定稿，realpath 语义）：node 解析对软链取 realpath——
        # profiles/sandbar/node_modules 若整体软链到依赖树，workbench 的 realpath=依赖树
        # （主树旧 client 被服出=克缝始终破坏+client/host 运行时错配）。故 node_modules
        # 必须是【实目录+逐项软链】：workbench 项直链 /repo（被测树），其余项链依赖树
        # /repo-nm（stage_docker 缺省=主树回落）。dsh 自愈农场（../../<dir> 相对链）的
        # 兄弟位也已预置（见上）。
        NM="/$$DSH_HOME/profiles/$$SANDBAR_TEST_PROFILE/node_modules"
        mkdir -p "$$NM"
        SRC_NM="/repo-nm/server/profile/node_modules"
        [ -d "$$SRC_NM" ] || SRC_NM="$$SANDBAR_TEST_PROFILE_SRC/node_modules"
        if [ -d "$$SRC_NM" ]; then
          for f in "$$SRC_NM"/*; do
            b="$${f##*/}"
            [ "$$b" = "sandbar-workbench" ] && continue
            [ -e "$$NM/$$b" ] || ln -sfn "$$f" "$$NM/$$b"
          done
        fi
        [ -d /repo/server/plugins/workbench ] && ln -sfn /repo/server/plugins/workbench "$$NM/sandbar-workbench"
        # 绑定面（gen4 定稿）：dsh CLI 的 --host 0.0.0.0 旗标有防 RCE 守卫，但
        # config 层（--patch 覆盖）允许 0.0.0.0——patch 直接钉 host+port 3199 直绑，
        # 无需任何转发代理（gen2 的 node 转发器方案拆除：代理链路是容器台与自搭台
        # 行为差异的嫌疑面，直绑=与自搭台完全同构）。
        printf '%s\n' '- id: webserver' '  config:' '    host: 0.0.0.0' '    port: 3199' > "$$DSH_HOME/port.patch.yml"
        exec dsh --profile "$$SANDBAR_TEST_PROFILE" --patch "$$DSH_HOME/port.patch.yml" --port 3199 --no-open
    # 注意：不设 depends_on（t260904-19）——dsh-only 舞台（Temporal 不可达=场景断言面）
    # 不能被依赖声明连带起 temporal；启动顺序由 stage_docker 按服务清单显式控制。
    restart: "no"   # 同上：生命周期归 stage_docker 管

volumes:
  temporal-data:
  dsh-home:

# ---- 受管网段（t260912-02 病灶三）：default 网络显式指定子网 ----
# 建网不再向 docker 分配器申请库存——「all predefined address pools have been
# fully subnetted」从根上消失（260912 实测：爆发 32 台走池 23/32，指定网段
# 32/32 1.35s）。子网来源两级：stage_docker 每台从受管表（SANDBAR_STAGE_NET_BASE，
# 缺省 10.213.0.0/16 切 /24）分配互异槽位并注入 SANDBAR_TEST_SUBNET（择槽即写
# 租约占位，并发互见——C2）；手工直跑 compose 不带 env 时落保留尾槽（单台可用，
# 并行手工台须各自显式传 SANDBAR_TEST_SUBNET）。网络随 compose down 自拆，
# 零新增清理义务。
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SANDBAR_TEST_SUBNET:-10.213.255.0/24}
