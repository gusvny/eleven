# 本文件由 server/dsh/temporal-poc/gen_workflows_doc.py 从 content_pipeline.py 的
# ContentPipelineTicketWorkflow.STAGES 生成；改模版=改类定义并重跑生成器（重跑即覆盖手改）。
id: content-pipeline
name: "内容加工"
lane: main
description: "内容加工（提案制）：提案→立项(人)→加工→机器QC→AI审校⇄修订≤2→终审(人)→发布闸门"
stages:
  - id: propose
    role: product-operation
    name: "提案"
    desc: "提案文件落 pipeline/proposals/<id>.md，状态机=提案"
    next: approve
    parts:
      - agent
    acceptance:
      - "提案文件落 pipeline/proposals/<id>.md"
      - "状态=提案，机器QC 清单列明"
  - id: approve
    role: integration
    name: "立项"
    desc: "「立项只能人」不可让渡红线：提案头部 状态=提案→立项 由人改"
    exit: human
    next: process
    parts:
      - human
    acceptance:
      - "提案头部 状态=立项（人改）"
  - id: process
    role: product-operation
    name: "加工"
    desc: "四件套/拓源产物落位，merge 语义防 append 翻倍；动数据先备份"
    next: machine-qc
    parts:
      - agent
    acceptance:
      - "动数据前备份先落 /tmp/"
      - "四件套/拓源产物落位"
      - "lint_residue 零残留"
      - "禁词零命中"
  - id: machine-qc
    role: product-operation
    name: "机器QC"
    desc: "按提案 §3 机器 QC 清单逐项脚本全绿（引提案不另立清单）"
    next: ai-review
    parts:
      - script
    # 脚本门（代码内 Stage.gate，仅注释展示）: qc_run {"scope": "all"}
    # 纯脚本门段（agent=False：无 agent 活动，只跑门）
    acceptance:
      - "按提案 §3 机器 QC 清单逐项脚本全绿（逐字校验/字数对齐等）"
  - id: ai-review
    role: product-operation
    name: "AI审校（异模型交叉）"
    desc: "分工=proofread（zai/glm-5.2 审校家，只判不改）；可扇出多审读 agent；docs 类文档审校意见落 docs/reviews 制式（review_store.py save）"
    fanout: 1
    revision_to: process
    next: final-review
    parts:
      - agent
    acceptance:
      - "报告=severity+位置+铁律条款"
      - "审校意见落 docs/reviews 制式（python3 server/dsh/knowledge/review_store.py save），返工指令随报告产出（review_store.py rework 一键复制）"
      - "revision_count ≤ 2（超限 rework to_stage=approve 回立项）"
  - id: final-review
    role: integration
    name: "终审"
    desc: "出口条件=human：只能人签字（提案 §6）"
    exit: human
    next: publish
    parts:
      - human
    acceptance:
      - "提案 §6 终审签字（机械读提案文件）"
  - id: publish
    role: integration
    name: "发布闸门"
    desc: "发布链重跑全绿，build_shelf 终装 + books.json 书集格式校验"
    parts:
      - agent
      - script
    # 脚本门（代码内 Stage.gate，仅注释展示）: verify_lane {"lane": "content", "scope": "auto"}
    acceptance:
      - "发布链重跑全绿（verify_lane content 道）"
      - "build_shelf 终装 + books.json 书集格式校验（中途态检测）"
