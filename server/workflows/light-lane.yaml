# LightLaneWorkflow.STAGES 生成；改模版=改类定义并重跑生成器（重跑即覆盖手改）。
id: light-lane
name: "Light Lane"
lane: worktree
description: "轻道（light lane）：prepare_workspace→implement→（UI 票 ui_evidence）→run_integration_tests（机器闸，一轮一判）→merge_check→merge（人审）——红转人，不自动仲裁、不自动重跑；不写方案（范围=票面声明的写集）"
stages:
  - id: implement
    role: developer
    name: "实现"
    desc: "Develop per the plan: stay inside the write set; an agent sandbox cannot write a real .git, commits are settled on behalf by the worker; unit tests ship with the implementation"
    next: ui_evidence
    parts:
      - agent
      - script
    acceptance:
      - "Changes stay inside the write set"
      - "Changes are committed to the lane branch (the worker settles on the agent's behalf)"
      - "Unit tests for the change run green"
  - id: ui_evidence
    role: developer
    name: "UI截图证据"
    desc: "Conditional stage (UI tickets only): after the implementation lands/settles the worker runs ui-check isolated-console screenshots into .sandbar/screenshots/ (script stage, no agent, no LLM; soft failure does not block the main chain, the merge_check UI-evidence gate is the backstop)"
    next: run_integration_tests
    parts:
      - script
    acceptance:
      - "UI tickets carry screenshots under .sandbar/screenshots/ (the merge_check UI-evidence gate checks it mechanically)"
  - id: run_integration_tests
    role: integration
    name: "跑集成测试"
    desc: "Programmatic (no agent): lane 0-commit precheck → pre-gate main sync (merge main into the lane once; the verified tree = the merged tree) → changed-file list → face-plan-narrowed fast-feedback set → run the project-declared integration command (the same command and executor as dev-lane); not green = blocked (ticket face = a human-readable digest: counts + at most 5 named violations for this ticket + up to 3 ways out; the full violation set is in blocked_detail/the receipt); no automatic re-run, no arbitration; a targeted round only passes on a closing full run"
    next: merge_check
    parts:
      - script
    # 脚本门（代码内 Stage.gate，仅注释展示）: verify_lane {"lane": "integ"}
    # 纯脚本门段（agent=False：无 agent 活动，只跑门）
    acceptance:
      - "The project-declared integration command ran and produced a receipt"
      - "Any red is carried through in full — every failing scenario name, the counts, and the receipt pointer"
  - id: merge_check
    role: integration
    name: "合并检查"
    desc: "Programmatic checks (no agent): the lane has commits, the worktree is clean, in-lane verify_lane is green, merge-tree has no conflict; phase entry re-merges main before the check (t261002-10: a retry_qc brings a main-side fix into the lane within one retry; up to date = zero action; a re-merge conflict goes to the existing resolution loop, unreachable = loud blocked); any red → blocked for a human (the light lane runs no automatic conflict-resolution rounds)"
    next: merge
    parts:
      - script
    # 纯脚本门段（agent=False：无 agent 活动，只跑门）
    acceptance:
      - "Lane branch has commits"
      - "Worktree is clean"
      - "The in-lane verify_lane check is green"
      - "merge dry-run has no conflict"
  - id: merge
    role: integration
    name: "合并（人审）"
    desc: "After human sign-off, execute the merge: merge main + lane cleanup (tear down the worktree, delete the branch); archive failure is fail-closed and keeps the lane"
    exit: human
    parts:
      - human
      - script
    acceptance:
      - "Human sign-off recorded"
      - "Merge booked and the lane is torn down after a successful archive"
