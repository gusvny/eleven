# 本文件由 server/engine/gen_workflows_doc.py 从 dev_lane.py 的
# DevLaneWorkflow.STAGES 生成；改模版=改类定义并重跑生成器（重跑即覆盖手改）。
id: dev-lane
name: "开发泳道"
lane: worktree
description: "开发泳道（developer 系唯一流程）：prepare_workspace→create_plan⇄review_plan→implement∥design_integration_tests→汇合（ui_evidence/UI 票）→run_integration_tests（验证前主同步 main）→arbitrate→acceptance_walkthrough→merge_check（程序化）→merge（人审）"
stages:
  - id: create_plan
    role: developer
    name: "做方案"
    desc: "Read the request and produce the implementation plan: changed-file list, steps, acceptance criteria; no code changes"
    next: review_plan
    parts:
      - agent
    acceptance:
      - "Plan written to the result file (changed-file list + steps + acceptance criteria)"
  - id: review_plan
    role: integration
    name: "审方案"
    desc: "Review the plan and write review comments: pass=ok / reject=failed+comments"
    next: implement
    parts:
      - agent
    acceptance:
      - "Review comments written to the result file"
      - "Explicit pass/reject verdict"
  - id: implement
    role: developer
    name: "实现"
    desc: "Develop per the plan: stay inside the write set; commits are settled on behalf by the worker (an agent sandbox cannot write a real .git); forks in parallel with design_integration_tests, both edges land in one joint settle"
    next: design_integration_tests
    parts:
      - agent
      - script
    acceptance:
      - "Changes stay inside the write set"
      - "Changes land in write-set files (worker-settled commit)"
      - "Related smoke/self-tests all green"
  - id: design_integration_tests
    role: integration
    name: "设计集成测试"
    desc: "Assess test needs from the plan: design/iterate the integration test set (repo integration/ directory, registered in the scenario list), covering concurrency and boundary failure surfaces; runs in parallel with implement, the test set is not shown to the developer"
    next: ui_evidence
    parts:
      - agent
    acceptance:
      - "Test set lands in the integration/ directory (and is registered in the scenario list)"
      - "Scenario coverage and failure-surface list written to the result file"
  - id: ui_evidence
    role: developer
    name: "UI截图证据"
    desc: "For UI tickets, after the implementation lands the worker runs ui-check/capture-lane.mjs on the isolated console, capturing each view into .sandbar/screenshots/ (soft failure does not block the main chain; the gate is the backstop)"
    next: run_integration_tests
    parts:
      - script
    acceptance:
      - "UI tickets have screenshots under .sandbar/screenshots/ (checked mechanically by the merge_check evidence gate)"
  - id: run_integration_tests
    role: integration
    name: "跑集成测试"
    desc: "Programmatic (no agent): precheck the lane landing (0 commits = implementation not landed → blocked); re-merge main once before the gate (t260922-18: worker-settled, idempotent when up to date; conflicts take the existing resolution loop back to implement; unreachable = loud blocked to a human); then run the project-declared scenario executor integration/run_scenarios.py (cwd=lane), the result JSON goes to arbitration"
    next: arbitrate
    parts:
      - script
    # 纯脚本门段（agent=False：无 agent 活动，只跑门）
    acceptance:
      - "The scenario executor ran all scenarios and produced a result"
  - id: arbitrate
    role: integration
    name: "仲裁"
    desc: "Read the mechanical test results and give a three-state verdict: pass / tests-fault (test-set problem, iterate and re-run, cap 5 rounds) / code-fault (code problem, integration test report sends work back to implement, cap 5 rounds)"
    next: acceptance_walkthrough
    parts:
      - agent
      - script
    acceptance:
      - "Explicit three-state verdict (pass/tests-fault/code-fault)"
      - "code-fault carries an integration test report"
  - id: acceptance_walkthrough
    role: integration
    name: "验收走查"
    desc: "After tests pass, integration walks the new feature from the user's perspective and writes the acceptance report (for the human review gate); walkthrough evidence is pre-produced by the worker (capture-lane isolated-console shots + DOM assertions); a code problem found → send back to implement (cap 2 rounds); the two close-out questions (retention question + reverse-sync gate) ride along with the walkthrough — unanswered does not block (doc-lifecycle ticket ②, wording=shared.STAGE_ACCEPTANCE_EXTRA, registration=agent_activities.apply_doc_gate)"
    next: merge_check
    parts:
      - agent
      - script
    acceptance:
      - "Acceptance report written to the result file (per-scenario conclusions)"
      - "Retention question has a prefilled suggestion or an explicit nothing-to-retain (unanswered is recorded, not blocking)"
      - "Contradiction-check conclusion written to the receipt (with a contradiction, the debt entry is registered as pending-doc-sync)"
  - id: merge_check
    role: integration
    name: "合并检查"
    desc: "Programmatic checks (no agent): the lane has commits, the worktree is clean, in-lane verify_lane is green, merge-tree has no conflict; phase entry re-merges main first (t261002-10: retry_qc re-runs bring the main fixes into the lane before the check, up to date = zero action; re-merge conflicts take the existing resolution loop, unreachable = loud blocked); only a dry-run conflict red → automatic send-back to implement for resolution (cap 3 rounds), any other red stays blocked for a human"
    next: merge
    parts:
      - script
    # 纯脚本门段（agent=False：无 agent 活动，只跑门）
    acceptance:
      - "Lane branch has commits"
      - "Worktree is clean (no uncommitted changes)"
      - "In-lane verify_lane code is green"
      - "merge dry-run has no conflict (ONLY a dry-run-conflict red auto-sends work back to implement for resolution, cap 3 rounds; other reds such as a dirty worktree or a verify_lane red stay blocked for a human)"
  - id: merge
    role: integration
    name: "合并（人审）"
    desc: "After human sign-off, execute the merge: merge main + lane cleanup (tear down the worktree, delete the branch); a merge failure (e.g. another lane advanced main during the sign-off window) auto-sends work back to merge_check for re-verification"
    exit: human
    parts:
      - human
      - script
    acceptance:
      - "Human sign-off recorded"
      - "Merge booked + lane cleaned up"
